# Pre-commit hooks (spec 07 "Repository standards", brief §9.4). Install once with `make setup`
# (or `uvx pre-commit install`). ESLint and type checks run in `make lint` and CI, not per commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/(api|agent)/
      - id: ruff-format
        files: ^apps/(api|agent)/
  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/web)
        entry: apps/web/node_modules/.bin/prettier --write --ignore-unknown
        language: unsupported
        files: ^apps/web/
        exclude: ^apps/web/src/lib/api/(openapi\.json|schema\.d\.ts)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
