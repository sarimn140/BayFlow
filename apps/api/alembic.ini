# Alembic configuration (spec 02 §9). The database URL is NOT stored here: alembic/env.py reads
# DATABASE_URL through app.core.config (process environment, then the repo-root .env).

[alembic]
script_location = %(here)s/alembic
# Run from apps/api: puts `app` on sys.path (also inside the Docker image, WORKDIR /app).
prepend_sys_path = .
path_separator = os
# e.g. 20261009_1530_8c1d2e3f4a5b_baseline_schema.py (spec 02 §9)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Keep generated revisions lint- and format-clean.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
